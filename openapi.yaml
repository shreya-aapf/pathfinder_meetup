openapi: 3.0.3
info:
  title: Hard Close mock systems API
  version: 1.0.0
  description: |
    Mock finance systems for the Pathfinder Summit "Hard Close" challenge: ClearLedger (invoice review),
    ProcureOS (purchase orders), ReceiptsLog (goods received), MeridianGL (general ledger), AuditTrail
    (fraud flags, close status), Vendors, Mailbox, the board Dashboard and an Admin service.
    All systems are Supabase Edge Functions; the first path segment is the function name.

    Authentication: a personal API key (`X-API-Key`) or a sign-in token (`Authorization: Bearer`).
    MeridianGL also accepts the shared key `demo-key-meridiangl`. Mailbox and key management need a
    sign-in token. Full details and examples are in API_REFERENCE.md.

    Every error is JSON: `{ "error": "<message>" }`.
servers:
  - url: https://jmbwyttobedzszswarhd.supabase.co/functions/v1
    description: Hosted project
tags:
  - name: Auth
  - name: ClearLedger
  - name: ProcureOS
  - name: ReceiptsLog
  - name: MeridianGL
  - name: AuditTrail
  - name: Vendors
  - name: Mailbox
  - name: Dashboard
  - name: Admin
security:
  - ApiKey: []
  - BearerAuth: []

paths:
  # ---------------------------------------------------------------- Auth
  /auth/register:
    post:
      tags: [Auth]
      summary: Create an account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string, minLength: 3, maxLength: 32, description: 'Letters, numbers, dot, dash, underscore; not case-sensitive' }
                password: { type: string, minLength: 8, description: 'Maximum 72 bytes' }
                confirm_password: { type: string, description: Optional; must match password when sent }
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /auth/login:
    post:
      tags: [Auth]
      summary: Sign in and get a 7-day token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429':
          description: Five wrong passwords in a row lock the account for five minutes
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '503': { $ref: '#/components/responses/Unavailable' }
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Renew the sign-in token for another 7 days
      security:
        - BearerAuth: []
      responses:
        '200':
          description: New token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/me:
    get:
      tags: [Auth]
      summary: Username, default API key and difficulty mode
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Profile
          content:
            application/json:
              schema:
                type: object
                properties:
                  username: { type: string }
                  api_key: { type: string, example: pf-AbC123xyz }
                  mode: { $ref: '#/components/schemas/Mode' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/mode:
    post:
      tags: [Auth]
      summary: Choose the difficulty mode
      description: Choosing `hard` assigns three random incoming invoices by an email titled "Close assignment". The same three are kept when the mode is set again.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mode]
              properties:
                mode: { $ref: '#/components/schemas/Mode' }
      responses:
        '200':
          description: Mode saved
          content:
            application/json:
              schema:
                type: object
                properties:
                  mode: { $ref: '#/components/schemas/Mode' }
                  assigned_invoices:
                    type: array
                    description: File names of the assigned invoices (empty unless mode is hard)
                    items: { type: string }
                    example: [BW_BW-2026-04581.json, IMG_4821.png, TWS_TWS-11044.pdf]
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
  /auth/key/rotate:
    post:
      tags: [Auth]
      summary: Replace the value of the default API key
      security:
        - BearerAuth: []
      responses:
        '200':
          description: New key; the old value stops working at once
          content:
            application/json:
              schema: { type: object, properties: { api_key: { type: string } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/keys:
    get:
      tags: [Auth]
      summary: List your named API keys, newest first
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Keys
          content:
            application/json:
              schema:
                type: object
                properties:
                  keys:
                    type: array
                    items: { $ref: '#/components/schemas/ApiKey' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Auth]
      summary: Create a named API key (up to 20 per account)
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 60 }
                expires_in_days: { type: integer, minimum: 1, maximum: 3650, nullable: true }
                expires_at: { type: string, format: date-time, description: 'Future timestamp, at most 10 years ahead; use instead of expires_in_days' }
      responses:
        '201':
          description: Key created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKey' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/keys/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    patch:
      tags: [Auth]
      summary: Rename a key or change its expiry
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string, maxLength: 60 }
                expires_in_days: { type: integer, minimum: 1, maximum: 3650, nullable: true }
                expires_at: { type: string, format: date-time, nullable: true, description: 'null means never expires' }
      responses:
        '200':
          description: Updated key
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApiKey' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Auth]
      summary: Revoke a key
      security:
        - BearerAuth: []
      responses:
        '204': { description: Revoked }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /auth/reset-my-work:
    post:
      tags: [Auth]
      summary: Restore the original scenario
      description: Deletes your invoices, POs, receipts, close-status changes, audit entries, documents, mailbox, hard-mode assignments and dashboard reports, then restores the starting data. Login and API key are kept.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Reset done
          content:
            application/json:
              schema: { type: object, properties: { ok: { type: boolean } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }

  # ---------------------------------------------------------------- ClearLedger
  /clearledger/api/invoices:
    post:
      tags: [ClearLedger]
      summary: Submit an extracted invoice with its mismatch analysis
      description: Fires an `invoice.created` webhook. An unknown `vendor_id` adds a vendor visible only to you.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoiceInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  invoice_number: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [ClearLedger]
      summary: List your invoices, newest first
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/InvoiceStatus' } }
        - { name: vendor_id, in: query, schema: { type: string } }
        - { name: po_number, in: query, schema: { type: string } }
        - { name: invoice_number, in: query, description: Exact match; still returns an array, empty when nothing matches, schema: { type: string } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Invoice rows without line items
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Invoice' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [ClearLedger]
      summary: Change an invoice or record a decision, addressed by invoice number
      description: |
        One endpoint for every change. Send only the fields that change. To rename, put the current number in the
        query and the new number in the body. `action` records a decision (`approve`, `contact_vendor`, `escalate`)
        and can travel together with corrections. Fires `invoice.updated`. In hard mode, `approve` and `escalate`
        also fire `invoice.closed`.
      parameters:
        - $ref: '#/components/parameters/InvoiceNumber'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoicePatch' }
      responses:
        '200':
          description: Updated invoice with its line items
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Invoice'
                  - type: object
                    properties:
                      line_items:
                        type: array
                        items: { $ref: '#/components/schemas/InvoiceLine' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /clearledger/api/invoices/upload:
    post:
      tags: [ClearLedger]
      summary: Create an invoice and attach its file in one request
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [invoice_number, vendor_id, vendor_name, po_number, total_amount, document]
              properties:
                invoice_number: { type: string }
                vendor_id: { type: string }
                vendor_name: { type: string }
                po_number: { type: string }
                total_amount: { type: number }
                invoice_date: { type: string, format: date }
                gr_number: { type: string }
                currency: { type: string, minLength: 3, maxLength: 3, default: USD }
                vendor_email: { type: string, format: email }
                document: { type: string, format: binary, description: 'pdf, png, jpg, jpeg, tif or tiff, up to 10 MB' }
      responses:
        '201':
          description: The new invoice row
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '500': { $ref: '#/components/responses/ServerError' }
  /clearledger/api/invoices/lookup/{invoice_number}:
    get:
      tags: [ClearLedger]
      summary: Find the id of an invoice by number
      description: Legacy helper. Numbers containing slashes cannot be used here; use `GET /clearledger/api/invoice?invoice_number=`.
      parameters:
        - { name: invoice_number, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Id
          content:
            application/json:
              schema: { type: object, properties: { id: { type: string, format: uuid } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /clearledger/api/invoice:
    get:
      tags: [ClearLedger]
      summary: Get one invoice by number
      parameters:
        - $ref: '#/components/parameters/InvoiceNumber'
      responses:
        '200': { $ref: '#/components/responses/InvoiceDetail' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /clearledger/api/invoices/{invoice_id}:
    parameters:
      - $ref: '#/components/parameters/InvoiceId'
    get:
      tags: [ClearLedger]
      summary: Get one invoice by id
      responses:
        '200': { $ref: '#/components/responses/InvoiceDetail' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [ClearLedger]
      summary: Change an invoice by id (older callers)
      deprecated: true
      description: Same body and response as `PATCH /clearledger/api/invoices?invoice_number=`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoicePatch' }
      responses:
        '200':
          description: Updated invoice with its line items
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /clearledger/api/invoices/{invoice_id}/action:
    patch:
      tags: [ClearLedger]
      summary: Record a decision by invoice id (older callers)
      deprecated: true
      parameters:
        - $ref: '#/components/parameters/InvoiceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { $ref: '#/components/schemas/InvoiceAction' }
                note: { type: string }
      responses:
        '200':
          description: Updated invoice
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /clearledger/api/invoice/document:
    post:
      tags: [ClearLedger]
      summary: Attach or replace an invoice file, by invoice number
      description: Fires `invoice.updated`. In hard mode the uploaded file name is matched against the assigned file names.
      parameters:
        - $ref: '#/components/parameters/InvoiceNumber'
      requestBody:
        $ref: '#/components/requestBodies/InvoiceFile'
      responses:
        '201': { $ref: '#/components/responses/InvoiceFileStored' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      tags: [ClearLedger]
      summary: Signed link to the invoice file, by invoice number
      parameters:
        - $ref: '#/components/parameters/InvoiceNumber'
      responses:
        '200': { $ref: '#/components/responses/SignedLink' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /clearledger/api/invoice/document/download:
    get:
      tags: [ClearLedger]
      summary: Download the invoice file, by invoice number
      parameters:
        - $ref: '#/components/parameters/InvoiceNumber'
      responses:
        '200': { $ref: '#/components/responses/FileBytes' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /clearledger/api/invoices/{invoice_id}/document:
    parameters:
      - $ref: '#/components/parameters/InvoiceId'
    post:
      tags: [ClearLedger]
      summary: Attach or replace an invoice file, by id
      requestBody:
        $ref: '#/components/requestBodies/InvoiceFile'
      responses:
        '201': { $ref: '#/components/responses/InvoiceFileStored' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      tags: [ClearLedger]
      summary: Signed link to the invoice file, by id
      responses:
        '200': { $ref: '#/components/responses/SignedLink' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /clearledger/api/invoices/{invoice_id}/document/download:
    get:
      tags: [ClearLedger]
      summary: Download the invoice file, by id
      parameters:
        - $ref: '#/components/parameters/InvoiceId'
      responses:
        '200': { $ref: '#/components/responses/FileBytes' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /clearledger/api/settings/threshold:
    get:
      tags: [ClearLedger]
      summary: Read your variance tolerance percentage
      responses:
        '200':
          description: Threshold
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Threshold' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [ClearLedger]
      summary: Set your variance tolerance percentage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [threshold_pct]
              properties:
                threshold_pct: { type: number, minimum: 0, maximum: 100 }
      responses:
        '200':
          description: Threshold saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Threshold' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  # ---------------------------------------------------------------- ProcureOS
  /procureos/api/po/{po_number}:
    get:
      tags: [ProcureOS]
      summary: Get a purchase order with its lines (primary automation endpoint)
      parameters:
        - $ref: '#/components/parameters/PoNumber'
      responses:
        '200':
          description: The purchase order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /procureos/api/pos:
    get:
      tags: [ProcureOS]
      summary: List purchase orders, newest first
      parameters:
        - { name: vendor_id, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/PoStatus' } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Stored PO rows without line items
          content:
            application/json:
              schema:
                type: object
                properties:
                  page: { type: integer }
                  limit: { type: integer }
                  count: { type: integer }
                  purchase_orders:
                    type: array
                    items: { type: object, additionalProperties: true }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [ProcureOS]
      summary: Create a purchase order
      description: |
        `line_items[].amount` and `total_amount` are computed on the server. The seven justification answers are
        required; send them flat (as below) or nested under `justification`. An unknown `vendor_id` adds a vendor
        visible only to you, using any `vendor_*` fields sent. `requester_email` adds a private mailbox contact.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PoInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /procureos/api/pos/{po_number}:
    parameters:
      - $ref: '#/components/parameters/PoNumber'
    put:
      tags: [ProcureOS]
      summary: Update a purchase order
      description: Omitted header fields keep their value. `line_items` replaces all lines and the total is recalculated; omitting it removes all lines.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PoInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PurchaseOrder' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [ProcureOS]
      summary: Delete a purchase order, its lines and its file
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /procureos/api/pos/{po_number}/document:
    parameters:
      - $ref: '#/components/parameters/PoNumber'
    post:
      tags: [ProcureOS]
      summary: Attach or replace a supporting file
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: 'pdf, png, jpg, jpeg, tif, tiff, doc, docx, xls or xlsx, up to 10 MB' }
      responses:
        '201':
          description: Stored
          content:
            application/json:
              schema:
                type: object
                properties:
                  po_number: { type: string }
                  document_name: { type: string }
                  document_path: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      tags: [ProcureOS]
      summary: Signed link to the supporting file
      responses:
        '200': { $ref: '#/components/responses/SignedLink' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /procureos/api/pos/{po_number}/document/download:
    get:
      tags: [ProcureOS]
      summary: Download the supporting file
      parameters:
        - $ref: '#/components/parameters/PoNumber'
      responses:
        '200': { $ref: '#/components/responses/FileBytes' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- ReceiptsLog
  /receiptslog/api/gr/by-po/{po_number}:
    get:
      tags: [ReceiptsLog]
      summary: Every receipt for a PO, oldest first (primary automation endpoint)
      parameters:
        - $ref: '#/components/parameters/PoNumber'
      responses:
        '200':
          description: Receipts; empty array when the PO has none
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/GoodsReceipt' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /receiptslog/api/gr/{gr_number}:
    get:
      tags: [ReceiptsLog]
      summary: Get one receipt
      parameters:
        - $ref: '#/components/parameters/GrNumber'
      responses:
        '200':
          description: The receipt
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GoodsReceipt' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /receiptslog/api/grs:
    get:
      tags: [ReceiptsLog]
      summary: List receipts
      parameters:
        - { name: po_number, in: query, schema: { type: string } }
        - { name: vendor_id, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { $ref: '#/components/schemas/GrStatus' } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Receipts
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/GoodsReceipt' }
                  page: { type: integer }
                  limit: { type: integer }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [ReceiptsLog]
      summary: Create a receipt
      description: Fires a `goods_receipt.created` webhook.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoodsReceiptInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GoodsReceipt' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409': { $ref: '#/components/responses/Conflict' }
  /receiptslog/api/grs/{gr_number}:
    parameters:
      - $ref: '#/components/parameters/GrNumber'
    put:
      tags: [ReceiptsLog]
      summary: Update a receipt
      description: Send any header field. `line_items`, when present, replaces all lines. Fires `goods_receipt.updated`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GoodsReceiptInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GoodsReceipt' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [ReceiptsLog]
      summary: Delete a receipt (no webhook)
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /receiptslog/api/grs/{gr_number}/document:
    parameters:
      - $ref: '#/components/parameters/GrNumber'
    post:
      tags: [ReceiptsLog]
      summary: Attach or replace a receipt file
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Stored
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    get:
      tags: [ReceiptsLog]
      summary: Signed link to the receipt file
      responses:
        '200': { $ref: '#/components/responses/SignedLink' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /receiptslog/api/grs/{gr_number}/document/download:
    get:
      tags: [ReceiptsLog]
      summary: Download the receipt file
      parameters:
        - $ref: '#/components/parameters/GrNumber'
      responses:
        '200': { $ref: '#/components/responses/FileBytes' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

