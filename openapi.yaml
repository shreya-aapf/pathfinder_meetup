        '401': { $ref: '#/components/responses/Unauthorized' }
  /audittrail/api/close-status/{id}:
    patch:
      tags: [AuditTrail]
      summary: Update a close-status item
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              minProperties: 1
              properties:
                status: { $ref: '#/components/schemas/CloseState' }
                owner: { type: string }
                note: { type: string }
      responses:
        '200':
          description: Updated item
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CloseItem' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Vendors
  /vendors/api/vendors:
    get:
      tags: [Vendors]
      summary: List shared vendors plus the vendors created from your own invoices and POs
      parameters:
        - { name: status, in: query, schema: { $ref: '#/components/schemas/VendorStatus' } }
        - { name: q, in: query, description: 'Matches name, id or email', schema: { type: string } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Limit' }
      responses:
        '200':
          description: Vendors ordered by vendor_id
          content:
            application/json:
              schema:
                type: object
                properties:
                  page: { type: integer }
                  limit: { type: integer }
                  count: { type: integer }
                  vendors:
                    type: array
                    items: { $ref: '#/components/schemas/Vendor' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Vendors]
      summary: Create a shared vendor (test key or admin credential)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VendorInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vendor' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /vendors/api/vendors/{vendor_id}:
    parameters:
      - { name: vendor_id, in: path, required: true, schema: { type: string }, example: VEND-001 }
    get:
      tags: [Vendors]
      summary: One vendor with your invoices and purchase orders for it
      responses:
        '200':
          description: Vendor detail
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Vendor'
                  - type: object
                    properties:
                      invoice_count: { type: integer }
                      purchase_order_count: { type: integer }
                      invoices: { type: array, items: { type: object, additionalProperties: true } }
                      purchase_orders: { type: array, items: { type: object, additionalProperties: true } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Vendors]
      summary: Update a shared vendor (test key or admin credential)
      description: Send only the fields that change; `null` clears an optional field. `vendor_id` cannot be changed.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VendorInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Vendor' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Vendors]
      summary: Delete a shared vendor (test key or admin credential)
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Mailbox
  /mailbox/contacts:
    get:
      tags: [Mailbox]
      summary: Shared contacts plus the contacts from your own invoices and POs
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Contacts ordered by name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Contact' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Mailbox]
      summary: Add a shared contact (test key or admin credential)
      security:
        - BearerAuth: []
        - ApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, name]
              properties:
                email: { type: string, format: email }
                name: { type: string }
                role: { type: string, default: Vendor }
                reply: { $ref: '#/components/schemas/ScriptedReply' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contact' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
    patch:
      tags: [Mailbox]
      summary: Update a shared contact, addressed by email query parameter
      security:
        - BearerAuth: []
        - ApiKey: []
      parameters:
        - { name: email, in: query, required: true, schema: { type: string, format: email } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                role: { type: string }
                reply: { $ref: '#/components/schemas/ScriptedReply' }
      responses:
        '200':
          description: Updated contact
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Contact' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /mailbox/send:
    post:
      tags: [Mailbox]
      summary: Send an email to a contact; a scripted reply arrives about 60 seconds later
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to, subject, body]
              properties:
                to: { type: string, format: email }
                subject: { type: string, maxLength: 200 }
                body: { type: string, maxLength: 10000 }
      responses:
        '201':
          description: The sent email and when the reply is due
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Email'
                  - type: object
                    properties:
                      reply_due_at: { type: string, format: date-time, nullable: true }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /mailbox/inbox:
    get:
      tags: [Mailbox]
      summary: Delivered emails, newest first, up to 200
      description: Also releases replies that are due. In hard mode the "Close assignment" email is here.
      security:
        - BearerAuth: []
      parameters:
        - { name: unread, in: query, schema: { type: boolean } }
      responses:
        '200':
          description: Emails; an empty array means nothing is due yet
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Email' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /mailbox/sent:
    get:
      tags: [Mailbox]
      summary: Sent emails, newest first, up to 200
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Emails
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Email' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /mailbox/emails/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Mailbox]
      summary: Get one email
      security:
        - BearerAuth: []
      responses:
        '200':
          description: The email
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Email' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Mailbox]
      summary: Mark an email read or unread
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [is_read]
              properties:
                is_read: { type: boolean }
      responses:
        '200':
          description: Updated email
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Email' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Dashboard
  /dashboard/api/summary:
    get:
      tags: [Dashboard]
      summary: Board figures for the CFO dashboard
      description: Combines the shared GL data (balance sheet trend, subsidiaries, intercompany, accruals, flux, vendor flags) with your own invoices, close status and hard-mode assignments. Invoice amounts are per currency and never converted.
      responses:
        '200':
          description: Summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DashboardSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /dashboard/api/webhook:
    post:
      tags: [Dashboard]
      summary: Receiver for the assignments.completed webhook
      description: |
        Called by the server when all three hard-mode invoices are closed. Creates one pending report for
        `data.owner_id`; a second call while one is pending creates nothing. The signature is
        `sha256=<hex HMAC-SHA256 of the raw body>` using `WEBHOOK_SECRET` (or the service role key when unset).
      security:
        - WebhookSignature: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [event, data]
              properties:
                event: { type: string, enum: [assignments.completed] }
                data:
                  type: object
                  required: [owner_id]
                  properties:
                    owner_id: { type: string, format: uuid }
      responses:
        '201':
          description: Report created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportCreated' }
        '200':
          description: A report was already pending
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportCreated' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /dashboard/api/reports/pending:
    get:
      tags: [Dashboard]
      summary: Your report waiting to be downloaded
      responses:
        '200':
          description: The oldest pending report, or null
          content:
            application/json:
              schema:
                type: object
                properties:
                  pending:
                    nullable: true
                    allOf:
                      - $ref: '#/components/schemas/Report'
        '401': { $ref: '#/components/responses/Unauthorized' }
  /dashboard/api/reports:
    get:
      tags: [Dashboard]
      summary: Your reports, newest first (up to 50)
      responses:
        '200':
          description: Reports
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Report' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /dashboard/api/reports/{id}/downloaded:
    post:
      tags: [Dashboard]
      summary: Mark a report as downloaded
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: Marked
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  status: { type: string, enum: [downloaded] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }

  # ---------------------------------------------------------------- Admin
  /admin/register-user:
    post:
      tags: [Admin]
      summary: Create and provision an account
      security:
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username: { type: string }
                password: { type: string }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string, format: uuid }
                  username: { type: string }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /admin/users:
    get:
      tags: [Admin]
      summary: All accounts, most recent sign-in first
      security:
        - AdminKey: []
      responses:
        '200':
          description: Accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string, format: uuid }
                    username: { type: string }
                    created_at: { type: string, format: date-time }
                    last_login_at: { type: string, format: date-time, nullable: true }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/delete-user:
    post:
      tags: [Admin]
      summary: Delete one account and all its data
      security:
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId: { type: string, format: uuid }
      responses:
        '200':
          description: Deleted
          content:
            application/json:
              schema: { type: object, properties: { deleted: { type: string, format: uuid } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/bulk-delete-users:
    post:
      tags: [Admin]
      summary: Delete several accounts; one failure does not stop the rest
      security:
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userIds]
              properties:
                userIds:
                  type: array
                  minItems: 1
                  items: { type: string, format: uuid }
      responses:
        '200':
          description: Per-user results
          content:
            application/json:
              schema:
                type: object
                properties:
                  requested: { type: integer }
                  successCount: { type: integer }
                  errorCount: { type: integer }
                  results: { type: array, items: { type: object, additionalProperties: true } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/clear-all-users:
    post:
      tags: [Admin]
      summary: Delete every account except the protected test accounts (Test01 to Test10)
      security:
        - AdminKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: boolean, enum: [true] }
      responses:
        '200':
          description: Counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  deletedUsers: { type: integer }
                  failed: { type: array, items: { type: object, additionalProperties: true } }
                  preservedTestUsers: { type: integer }
                  before: { type: integer }
                  after: { type: integer }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/reset-test-users:
    post:
      tags: [Admin]
      summary: Rebuild the work queue of every protected test account
      security:
        - AdminKey: []
      responses:
        '200':
          description: Per-account results
          content:
            application/json:
              schema:
                type: object
                properties:
                  requested: { type: integer }
                  successCount: { type: integer }
                  results: { type: array, items: { type: object, additionalProperties: true } }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/progress:
    get:
      tags: [Admin]
      summary: Invoice and close-status progress of each protected test account
      security:
        - AdminKey: []
      responses:
        '200':
          description: Progress
          content:
            application/json:
              schema:
                type: object
                properties:
                  accounts:
                    type: array
                    items:
                      type: object
                      properties:
                        username: { type: string }
                        invoices: { type: object, additionalProperties: { type: integer } }
                        close_status: { type: object, additionalProperties: { type: integer } }
                        work_remaining: { type: boolean }
                  accountsWithWorkRemaining: { type: integer }
        '403': { $ref: '#/components/responses/Forbidden' }

x-webhooks:
  invoice.created:
    post:
      summary: An invoice was created (POST /clearledger/api/invoices or /upload)
      requestBody:
        $ref: '#/components/requestBodies/InvoiceWebhook'
      responses:
        '200': { description: Receiver acknowledges }
  invoice.updated:
    post:
      summary: An invoice was changed, decided on, or had its file replaced
      requestBody:
        $ref: '#/components/requestBodies/InvoiceWebhook'
      responses:
        '200': { description: Receiver acknowledges }
  invoice.closed:
    post:
      summary: Hard mode only. An invoice was approved or escalated
      requestBody:
        $ref: '#/components/requestBodies/InvoiceWebhook'
      responses:
        '200': { description: Receiver acknowledges }
  goods_receipt.created:
    post:
      summary: A receipt was created
      requestBody:
        $ref: '#/components/requestBodies/GoodsReceiptWebhook'
      responses:
        '200': { description: Receiver acknowledges }
  goods_receipt.updated:
    post:
      summary: A receipt was updated
      requestBody:
        $ref: '#/components/requestBodies/GoodsReceiptWebhook'
      responses:
        '200': { description: Receiver acknowledges }
  email.received:
    post:
      summary: A vendor reply reached a user's inbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/WebhookEnvelope'
                - type: object
                  properties:
                    data: { $ref: '#/components/schemas/Email' }
      responses:
        '200': { description: Receiver acknowledges }

components:
  securitySchemes:
    ApiKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: 'Personal API key (`pf-...`) or the shared test key. Also accepted as `Authorization: Bearer <key>`.'
    BearerAuth:
      type: http
      scheme: bearer
      description: Sign-in token from POST /auth/login (7 days).
    GlKey:
      type: apiKey
      in: header
      name: X-API-Key
      description: Shared MeridianGL key `demo-key-meridiangl`.
    AdminKey:
      type: http
      scheme: bearer
      description: Admin credential (the service role key or the PRIVATE_API_KEY secret). Never use from the web UI.
    WebhookSignature:
      type: apiKey
      in: header
      name: X-Webhook-Signature
      description: '`sha256=<hex HMAC-SHA256 of the raw body>`'

  parameters:
    Page: { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
    Limit: { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200, default: 50 } }
    Subsidiary: { name: subsidiary, in: query, schema: { $ref: '#/components/schemas/Subsidiary' } }
    InvoiceNumber:
      name: invoice_number
      in: query
      required: true
      description: Invoice number, URL-encoded. Numbers can contain slashes, so it is never put in the path.
      schema: { type: string }
      example: SSC/26-27/0388
    InvoiceId:
      name: invoice_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PoNumber:
      name: po_number
      in: path
      required: true
      schema: { type: string }
      example: PO-0004101
    GrNumber:
      name: gr_number
      in: path
      required: true
      schema: { type: string }
      example: RCT-0007201

  requestBodies:
    InvoiceFile:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [file]
            properties:
              file: { type: string, format: binary, description: 'pdf, png, jpg, jpeg, tif or tiff, up to 10 MB' }
    InvoiceWebhook:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/WebhookEnvelope'
              - type: object
                properties:
                  data:
                    allOf:
                      - $ref: '#/components/schemas/Invoice'
                      - type: object
                        properties:
                          document_url: { type: string, nullable: true, description: Signed link valid for one hour }
                          action: { type: string, description: Present when a decision was sent }
                          note: { type: string }
    GoodsReceiptWebhook:
      required: true
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/WebhookEnvelope'
              - type: object
                properties:
                  data: { $ref: '#/components/schemas/GoodsReceipt' }

  responses:
    BadRequest:
      description: Missing or invalid field, or the body is not JSON
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing X-API-Key header, invalid or expired key, or sign-in required
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Forbidden:
      description: The credential is not allowed to make this change
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Not found, or it belongs to another user
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Duplicate record
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    ServerError:
      description: Server or database error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unavailable:
      description: The service is unavailable right now
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    InvoiceDetail:
      description: The invoice with line items, action history, vendor flag and threshold
      content:
        application/json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Invoice'
              - type: object
                properties:
                  line_items: { type: array, items: { $ref: '#/components/schemas/InvoiceLine' } }
                  actions:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, format: uuid }
                        invoice_id: { type: string, format: uuid }
                        action_type: { type: string }
                        note: { type: string, nullable: true }
                        actioned_at: { type: string, format: date-time }
                  vendor_flag:
                    type: object
                    nullable: true
                    properties:
                      id: { type: string, format: uuid }
                      status: { type: string }
                      flag_type: { type: string }
                  threshold_pct: { type: number }
    InvoiceFileStored:
      description: File stored
      content:
        application/json:
          schema:
            type: object
            properties:
              id: { type: string, format: uuid }
              document_name: { type: string }
              document_path: { type: string }
    SignedLink:
      description: Signed download link
      content:
        application/json:
          schema:
            type: object
            properties:
              document_name: { type: string }
              url: { type: string, format: uri }
              expires_in: { type: integer, example: 3600 }
    FileBytes:
      description: 'The file, with a Content-Disposition: attachment header'
      content:
        application/octet-stream:
          schema: { type: string, format: binary }

  schemas:
    Error:
      type: object
      properties:
        error: { type: string }
    Mode:
      type: string
      enum: [easy, medium, hard]
    Session:
      type: object
      properties:
        token: { type: string }
        expires_at: { type: integer, description: Unix time in seconds }
        username: { type: string }
    ApiKey:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        api_key: { type: string }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time, nullable: true }
        expired: { type: boolean }
    Subsidiary:
      type: string
      enum: [A, B, C]
    InvoiceStatus:
      type: string
      enum: [pending, approved, escalated, contacted]
    InvoiceAction:
      type: string
      enum: [approve, contact_vendor, escalate]
      description: approve sets approved, contact_vendor sets contacted, escalate sets escalated
    MatchStatus:
      type: string
      enum: [mismatch, partial_match]
    MismatchType:
      type: string
      enum: [price_variance, qty_mismatch, missing_gr, ok]
    InvoiceLineInput:
      type: object
      required: [line_number]
      properties:
        line_number: { type: integer }
        description: { type: string }
        invoice_qty: { type: number }
        invoice_unit_price: { type: number }
        po_qty: { type: number }
        po_unit_price: { type: number }
        gr_qty: { type: number }
        variance_amount: { type: number }
        mismatch_type: { $ref: '#/components/schemas/MismatchType' }
    InvoiceLine:
      allOf:
        - $ref: '#/components/schemas/InvoiceLineInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            invoice_id: { type: string, format: uuid }
    InvoiceInput:
      type: object
      required: [invoice_number, vendor_id, vendor_name, invoice_date, po_number, total_amount, match_status]
      properties:
        invoice_number: { type: string, example: INV-2024-050 }
        vendor_id: { type: string, example: VEND-001 }
        vendor_name: { type: string }
        vendor_email: { type: string, format: email }
        invoice_date: { type: string, format: date }
        po_number: { type: string }
        gr_number: { type: string }
        total_amount: { type: number }
        currency: { type: string, minLength: 3, maxLength: 3, default: USD }
        match_status: { $ref: '#/components/schemas/MatchStatus' }
        variance_amount: { type: number, default: 0 }
        variance_pct: { type: number, default: 0 }
        line_items:
          type: array
          items: { $ref: '#/components/schemas/InvoiceLineInput' }
    InvoicePatch:
      type: object
      minProperties: 1
      description: Send only the fields that change.
      properties:
        invoice_number: { type: string, description: New number; must be unused }
        vendor_id: { type: string }
        vendor_name: { type: string }
        po_number: { type: string }
        invoice_date: { type: string, format: date, nullable: true }
        gr_number: { type: string, nullable: true }
        total_amount: { type: number }
        variance_amount: { type: number }
        variance_pct: { type: number }
        currency: { type: string, minLength: 3, maxLength: 3 }
        match_status:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/MatchStatus'
        action: { $ref: '#/components/schemas/InvoiceAction' }
        note: { type: string, description: Saved with the action; ignored when action is absent }
        line_items:
          type: array
          description: An existing line_number is updated with the fields sent, a new one adds a line, other lines are untouched
          items: { $ref: '#/components/schemas/InvoiceLineInput' }
    Invoice:
      type: object
      properties:
        id: { type: string, format: uuid }
        owner_id: { type: string, format: uuid }
        invoice_number: { type: string }
        vendor_id: { type: string }
        vendor_name: { type: string }
        invoice_date: { type: string, format: date, nullable: true }
        po_number: { type: string }
        gr_number: { type: string, nullable: true }
        total_amount: { type: number }
        currency: { type: string }
        match_status:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/MatchStatus'
        variance_amount: { type: number }
        variance_pct: { type: number }
        status: { $ref: '#/components/schemas/InvoiceStatus' }
        document_name: { type: string, nullable: true }
        document_path: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Threshold:
      type: object
      properties:
        threshold_pct: { type: number }
        updated_at: { type: string, format: date-time }
    PoStatus:
      type: string
      enum: [open, partially_received, closed, cancelled]
    PoLine:
      type: object
      properties:
        line_number: { type: integer }
        item_code: { type: string }
        description: { type: string }
        quantity: { type: number }
        unit_price: { type: number }
        amount: { type: number, readOnly: true, description: quantity x unit_price, computed by the server }
    PoJustification:
      type: object
      properties:
        purchase_what: { type: string }
        purchase_why: { type: string }
        no_purchase_impact: { type: string }
        criticality: { type: string, enum: [keep_the_lights_on, nice_to_have] }
        alternative_tool: { type: string }
        roi_benefit: { type: string }
        okr_alignment: { type: string }
    PoInput:
      allOf:
        - $ref: '#/components/schemas/PoJustification'
        - type: object
          required: [po_number]
          properties:
            po_number: { type: string }
            vendor_id: { type: string }
            vendor_name: { type: string }
            issue_date: { type: string, format: date }
            delivery_date: { type: string, format: date }
            status: { $ref: '#/components/schemas/PoStatus' }
            currency: { type: string, default: USD }
            justification: { $ref: '#/components/schemas/PoJustification' }
            requester_email: { type: string, format: email }
            requester_name: { type: string }
            vendor_email: { type: string, format: email }
            vendor_contact_name: { type: string }
            vendor_phone: { type: string }
            vendor_website: { type: string }
            vendor_address: { type: string }
            vendor_city: { type: string }
            vendor_country: { type: string }
            vendor_tax_id: { type: string }
            vendor_payment_terms: { type: string }
            line_items:
              type: array
              items: { $ref: '#/components/schemas/PoLine' }
    PurchaseOrder:
      type: object
      properties:
        po_number: { type: string }
        vendor_id: { type: string }
        vendor_name: { type: string }
        issue_date: { type: string, format: date }
        delivery_date: { type: string, format: date }
        status: { $ref: '#/components/schemas/PoStatus' }
        currency: { type: string }
        total_amount: { type: number }
        document_name: { type: string, nullable: true }
        justification: { $ref: '#/components/schemas/PoJustification' }
        line_items:
          type: array
          items: { $ref: '#/components/schemas/PoLine' }
    GrStatus:
      type: string
      enum: [partial, complete, rejected]
    GrLine:
      type: object
      properties:
        line_number: { type: integer }
        item_code: { type: string }
        description: { type: string }
        quantity_ordered: { type: number }
        quantity_received: { type: number }
        unit_price: { type: number }
        condition: { type: string, enum: [good, damaged, rejected], default: good }
    GoodsReceiptInput:
      type: object
      required: [gr_number, po_number, vendor_id, vendor_name, received_date, received_by, status]
      properties:
        gr_number: { type: string }
        po_number: { type: string }
        vendor_id: { type: string }
        vendor_name: { type: string }
        received_date: { type: string, format: date }
        received_by: { type: string }
        status: { $ref: '#/components/schemas/GrStatus' }
        line_items:
          type: array
          items: { $ref: '#/components/schemas/GrLine' }
    GoodsReceipt:
      allOf:
        - $ref: '#/components/schemas/GoodsReceiptInput'
    GlAccount:
      type: object
      properties:
        id: { type: string, format: uuid }
        subsidiary: { $ref: '#/components/schemas/Subsidiary' }
        account_code: { type: string }
        account_name: { type: string }
        account_type: { type: string, enum: [asset, liability, equity, revenue, expense] }
        created_at: { type: string, format: date-time }
    GlBalance:
      type: object
      properties:
        id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        period: { type: string, example: 2024-11 }
        gl_balance: { type: number }
        subledger_balance: { type: number }
        variance_amount: { type: number }
        source_doc_ref: { type: string, nullable: true }
        status: { type: string, enum: [matched, variance] }
        subsidiary: { $ref: '#/components/schemas/Subsidiary' }
        account_code: { type: string }
        account_name: { type: string }
        account_type: { type: string }
    IntercompanyTransaction:
      type: object
      properties:
        id: { type: string, format: uuid }
        transaction_ref: { type: string }
        subsidiary_from: { $ref: '#/components/schemas/Subsidiary' }
        subsidiary_to: { $ref: '#/components/schemas/Subsidiary' }
        amount: { type: number }
        description: { type: string }
        posted_date_from: { type: string, format: date }
        posted_date_to: { type: string, format: date }
        flag_type: { type: string, enum: [matched, timing_difference, error] }
        note: { type: string, nullable: true }
    Accrual:
      type: object
      properties:
        id: { type: string, format: uuid }
        subsidiary: { $ref: '#/components/schemas/Subsidiary' }
        period: { type: string }
        description: { type: string }
        estimated_amount: { type: number }
        actual_amount: { type: number }
        variance_pct: { type: number }
        tolerance_pct: { type: number }
        blocked_by_open_ap: { type: boolean }
        ap_reference: { type: string, nullable: true }
        status: { type: string, enum: [within_tolerance, flagged, blocked] }
    VendorFlag:
      type: object
      properties:
        id: { type: string, format: uuid }
        vendor_id: { type: string }
        vendor_name: { type: string }
        invoice_number: { type: string }
        flag_type: { type: string, enum: [bank_mismatch, duplicate_vendor, other] }
        registered_bank_details: { type: string }
        submitted_bank_details: { type: string }
        severity: { type: string, enum: [low, medium, high] }
        status: { type: string, enum: [open, cleared, escalated] }
        created_at: { type: string, format: date-time }
    FluxRow:
      type: object
      properties:
        id: { type: string, format: uuid }
        category: { type: string, enum: [revenue, opex, cash] }
        subsidiary: { $ref: '#/components/schemas/Subsidiary' }
        period: { type: string, example: 2024-Q4 }
        actual: { type: number }
        prior_quarter: { type: number }
        budget: { type: number }
        variance_vs_prior_pct: { type: number }
        variance_vs_budget_pct: { type: number }
        explanation: { type: string, nullable: true }
        linked_reference: { type: string, nullable: true }
        status: { type: string, enum: [explained, unexplained] }
    AuditEntry:
      type: object
      properties:
        id: { type: string, format: uuid }
        owner_id: { type: string, format: uuid }
        agent_name: { type: string }
        action_checked: { type: string }
        decision: { type: string }
        evidence: { type: string, nullable: true }
        escalation_reason: { type: string, nullable: true }
        related_reference: { type: string, nullable: true }
        created_at: { type: string, format: date-time }
    CloseState:
      type: string
      enum: [cleared, exception_documented, escalated]
    CloseItem:
      type: object
      properties:
        id: { type: string, format: uuid }
        owner_id: { type: string, format: uuid }
        item_name: { type: string }
        category: { type: string, enum: [Vendor Flag, GL Variance, Intercompany, Accrual, Flux] }
        status: { $ref: '#/components/schemas/CloseState' }
        owner: { type: string }
        note: { type: string, nullable: true }
        related_reference: { type: string, nullable: true }
        updated_at: { type: string, format: date-time }
    VendorStatus:
      type: string
      enum: [active, inactive, on_hold]
    VendorInput:
      type: object
      required: [vendor_id, vendor_name]
      description: On PATCH nothing is required and vendor_id cannot be changed.
      properties:
        vendor_id: { type: string }
        vendor_name: { type: string }
        status: { $ref: '#/components/schemas/VendorStatus' }
        contact_name: { type: string, nullable: true }
        email: { type: string, format: email, nullable: true }
        phone: { type: string, nullable: true }
        website: { type: string, nullable: true }
        address: { type: string, nullable: true }
        city: { type: string, nullable: true }
        country: { type: string, nullable: true }
        tax_id: { type: string, nullable: true }
        payment_terms: { type: string, nullable: true }
        currency: { type: string, default: USD }
        notes: { type: string, nullable: true }
    Vendor:
      allOf:
        - $ref: '#/components/schemas/VendorInput'
        - type: object
          properties:
            id: { type: string, format: uuid }
            shared: { type: boolean, description: 'true for the shared base vendors, false for vendors created from your own invoices and POs' }
            created_at: { type: string, format: date-time }
            updated_at: { type: string, format: date-time }
    ScriptedReply:
      type: object
      properties:
        subject: { type: string }
        body: { type: string }
    Contact:
      type: object
      properties:
        email: { type: string, format: email }
        name: { type: string }
        role: { type: string }
    Email:
      type: object
      properties:
        id: { type: string, format: uuid }
        owner: { type: string }
        direction: { type: string, enum: [sent, received] }
        from_addr: { type: string }
        to_addr: { type: string }
        subject: { type: string }
        body: { type: string }
        sent_at: { type: string, format: date-time }
        deliver_at: { type: string, format: date-time }
        in_reply_to: { type: string, format: uuid, nullable: true }
        is_read: { type: boolean }
    Report:
      type: object
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [pending, downloaded] }
        created_at: { type: string, format: date-time }
        downloaded_at: { type: string, format: date-time, nullable: true }
        trigger_data: { type: object, additionalProperties: true }
    ReportCreated:
      type: object
      properties:
        id: { type: string, format: uuid }
        created: { type: boolean }
    WebhookEnvelope:
      type: object
      description: Sent as POST with headers `X-Webhook-Event` and, when WEBHOOK_SECRET is set, `X-Webhook-Signature`. One attempt, 3 second timeout, no retries.
      properties:
        event: { type: string }
        source: { type: string, enum: [clearledger, receiptslog, mailbox] }
        occurred_at: { type: string, format: date-time }
        data: { type: object, additionalProperties: true }
    DashboardSummary:
      type: object
      properties:
        mode: { $ref: '#/components/schemas/Mode' }
        generated_at: { type: string, format: date-time }
        period: { type: string, nullable: true }
        balance_sheet:
          type: object
          properties:
            latest_period: { type: string, nullable: true }
            trend:
              type: array
              items:
                type: object
                properties:
                  period: { type: string }
                  asset: { type: number }
                  liability: { type: number }
                  equity: { type: number }
                  revenue: { type: number }
                  expense: { type: number }
            by_subsidiary: { type: object, additionalProperties: { type: object, additionalProperties: { type: number } } }
            variance_count: { type: integer }
            variance_amount: { type: number }
        intercompany:
          type: object
          properties:
            by_flag: { type: object, additionalProperties: { type: integer } }
            error_amount: { type: number }
            timing_amount: { type: number }
            total: { type: integer }
        accruals:
          type: object
          properties:
            by_status: { type: object, additionalProperties: { type: integer } }
            estimated: { type: number }
            actual: { type: number }
            blocked_by_open_ap: { type: integer }
        flux:
          type: object
          properties:
            period: { type: string, nullable: true }
            by_category: { type: object, additionalProperties: { type: object, additionalProperties: { type: number } } }
            unexplained: { type: integer }
            total: { type: integer }
        vendor_flags:
          type: object
          properties:
            by_status: { type: object, additionalProperties: { type: integer } }
            open_high: { type: integer }
        invoices:
          type: object
          properties:
            total: { type: integer }
            by_status: { type: object, additionalProperties: { type: integer } }
            by_match: { type: object, additionalProperties: { type: integer } }
            amounts:
              type: object
              description: Per currency; never converted or added across currencies
              additionalProperties: { type: object, additionalProperties: { type: number } }
            top_open:
              type: array
              items:
                type: object
                properties:
                  invoice_number: { type: string }
                  vendor_name: { type: string }
                  currency: { type: string }
                  total_amount: { type: number }
                  match_status: { type: string, nullable: true }
        close:
          type: object
          properties:
            total: { type: integer }
            cleared: { type: integer }
            by_status: { type: object, additionalProperties: { type: integer } }
            pct_complete: { type: number }
        assignments:
          type: object
          properties:
            total: { type: integer }
            resolved: { type: integer }
            files: { type: array, items: { type: string } }
