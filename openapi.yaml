      responses:
        '200':
          description: Flags
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/VendorFlag' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /audittrail/api/vendor-flags/{id}:
    get:
      tags: [AuditTrail]
      summary: Get one vendor flag
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The flag
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VendorFlag' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /audittrail/api/flux-analysis:
    get:
      tags: [AuditTrail]
      summary: Flux analysis rows
      parameters:
        - { name: category, in: query, schema: { type: string, enum: [revenue, opex, cash] } }
        - { name: status, in: query, schema: { type: string, enum: [explained, unexplained] } }
      responses:
        '200':
          description: Flux rows
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FluxRow' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /audittrail/api/audit-trail:
    get:
      tags: [AuditTrail]
      summary: Your audit entries, newest first
      parameters:
        - { name: related_reference, in: query, description: For example an invoice number, schema: { type: string } }
      responses:
        '200':
          description: Entries
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AuditEntry' }
